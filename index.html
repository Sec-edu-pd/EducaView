  <title>Acesso Restrito - Educacenso</title>
  
  <!-- SheetJS para processar planilhas (Mantido do seu projeto) -->

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }

    /* TELA DE LOGIN */
    #login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
    }

    .login-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .login-card h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #0d9488;
    }

    .login-card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .login-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      margin-bottom: 16px;
      font-size: 0.95rem;
      outline: none;
    }

    .login-input:focus {
      border-color: #0d9488;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0d9488;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #0f766e;
    }

    #erro-senha {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      font-weight: 600;
    }

    /* CONTÊINER ONDE O SEU PROJETO SERÁ CARREGADO */
    #app-container {
      display: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- TELA DE SOLICITAÇÃO DE SENHA -->
  <div id="login-container">
    <div class="login-card">
      <h2>📂 Educacenso</h2>
      <p>Digite a senha para acessar o sistema.</p>
      <input type="password" id="input-senha" class="login-input" placeholder="Digite sua senha..." onkeypress="if(event.key==='Enter') tentarAcesso()">
      <button onclick="tentarAcesso()" class="btn-login">Entrar no Sistema</button>
      <div id="erro-senha">⚠️ Senha incorreta ou dados corrompidos!</div>
    </div>
  </div>

  <!-- ÁREA DO EDUCACENSO -->
  <div id="app-container"></div>

const SAL_HEX = "28f47669d86cd2b1d2e975206be525e5";
const IV_HEX = "c2b8ffa82e4884793c2d78ab";
    // -------------------------------------------------------------

    const hexToBytes = hex => Uint8Array.from(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

    async function tentarAcesso() {
      const senha = document.getElementById('input-senha').value;
      const erroEl = document.getElementById('erro-senha');
      erroEl.style.display = 'none';

      if (!senha) return;

      try {
        const enc = new TextEncoder();
        
        // 1. Gera a chave de descriptografia baseada na senha
        const keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: hexToBytes(SAL_HEX),
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        // 2. Descriptografa o conteúdo original
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: hexToBytes(IV_HEX) },
          key,
          hexToBytes(DADOS_CRIPTOGRAFADOS)
        );

        const dec = new TextDecoder();
        const htmlEducacenso = dec.decode(decrypted);

        // 3. Monta o HTML completo dentro de um documento isolado
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlEducacenso, 'text/html');

        // Transfere o CSS do seu projeto original para a página atual
        const styles = doc.querySelectorAll('style, link[rel="stylesheet"]');
        styles.forEach(st => document.head.appendChild(st.cloneNode(true)));

        // Insere o HTML dentro do contêiner da aplicação
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = doc.body.innerHTML;

        // Executa os scripts mantendo o escopo global do window
        const scripts = doc.querySelectorAll('script');
        scripts.forEach(sc => {
          // Descarta a importação duplicada da biblioteca SheetJS se ela existir no código original
          if (sc.src && sc.src.includes('xlsx')) return;

          const newScript = document.createElement('script');
          if (sc.src) {
            newScript.src = sc.src;
          } else {
            newScript.textContent = sc.textContent;
          }
          document.body.appendChild(newScript);
        });

        // Oculta a tela de login e exibe o sistema
        document.getElementById('login-container').style.display = 'none';
        appContainer.style.display = 'flex';

      } catch (e) {
        console.error(e);
        erroEl.style.display = 'block';
      }
    }
